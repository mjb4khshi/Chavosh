[package]
name = "chavosh"
version = "1.0.0"
description = "Chavosh — a lightweight music player"
edition = "2021"

[lib]
name = "chavosh_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
walkdir = "2"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
strip = false
